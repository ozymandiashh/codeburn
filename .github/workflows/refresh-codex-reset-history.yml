name: Refresh Codex reset history

# The Codex reset forecast reads a dataset published from this repository. This
# workflow is the only thing that refreshes it, and it is the only thing that
# ever contacts codex-reset.com: the client never does.
#
# #725 exception granted by the maintainer on 2026-09-13: a client-side,
# first-party, conditional fetch of the reset-history dataset from this
# repository on GitHub, at most hourly, carrying no user data; no request is
# ever made to codex-reset.com or any third party from the client.
#
# Two publication paths, for two different jobs:
#
#   data/codex-reset-history   every 30 minutes, pushed directly. This is what
#                              installed clients conditionally GET, so it is what
#                              makes the record fresher than a release cycle.
#   main (pull request)        weekly. Keeps the record bundled in releases
#                              recent, which is the offline fallback and the
#                              floor a fetch can only improve on.
#
# Source: https://codex-reset.com/api/timeline, a public community tracker that
# is not operated by or endorsed by OpenAI. Only event ids, timestamps, the
# event type and a reset kind are kept; every text field is dropped by
# scripts/refresh-codex-reset-history.mjs and never reaches the repo.

on:
  schedule:
    # Every 30 minutes. The upstream caches for 60s, so this is cheap, and it
    # bounds how far behind the tracker an online client can be.
    - cron: "*/30 * * * *"
    # Weekly, and additionally opens or updates the pull request to main.
    - cron: "23 6 * * 1"
  workflow_dispatch:

# No `push` trigger, deliberately: this workflow pushes to
# `data/codex-reset-history`, and a push trigger would make it retrigger itself
# every 30 minutes forever.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-codex-reset-history
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'getagentseal/codeburn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_BRANCH: data/codex-reset-history
      REVIEW_BRANCH: chore/codex-reset-history
      CANONICAL: src/data/codex-reset-history.json
      BUNDLED: mac/Sources/CodeBurnMenubar/Resources/CodexResetHistory/codex-reset-history.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and normalize the timeline
        run: node scripts/refresh-codex-reset-history.mjs

      - name: Check the dataset the client will actually read
        # The refresh script validates its own output; this runs the client's
        # own parser over the written file, so a dataset that validates but that
        # the forecast cannot use is never published.
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const canonical = readFileSync('src/data/codex-reset-history.json', 'utf8')
          const bundled = readFileSync('mac/Sources/CodeBurnMenubar/Resources/CodexResetHistory/codex-reset-history.json', 'utf8')
          if (canonical !== bundled) throw new Error('The CLI dataset and the menubar copy differ.')
          const doc = JSON.parse(canonical)
          const resets = doc.events.filter(e => e.type === 'reset')
          if (resets.length < 2) throw new Error(`Only ${resets.length} resets.`)
          const times = resets.map(e => Date.parse(e.announced_at))
          for (let i = 1; i < times.length; i += 1) {
            if (!(times[i] > times[i - 1])) throw new Error(`Reset timestamps are not increasing at index ${i}.`)
          }
          console.log(`${doc.events.length} events, ${resets.length} resets, newest ${resets[resets.length - 1].announced_at}.`)
          NODE

      - name: Stash the refreshed files
        # Both publication paths start from a clean checkout of a different ref,
        # so the two files are carried out of band rather than dragged across a
        # branch switch.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dataset"
          cp "$CANONICAL" "$RUNNER_TEMP/dataset/canonical.json"
          cp "$BUNDLED" "$RUNNER_TEMP/dataset/bundled.json"
          git checkout -- "$CANONICAL" "$BUNDLED"

      - name: Publish to the data branch
        env:
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git switch -C "$DATA_BRANCH" "origin/$DATA_BRANCH"
            lease="--force-with-lease=refs/heads/${DATA_BRANCH}:$(git rev-parse "origin/$DATA_BRANCH")"
          else
            git switch -C "$DATA_BRANCH"
            lease=""
          fi

          mkdir -p "$(dirname "$CANONICAL")" "$(dirname "$BUNDLED")"
          cp "$RUNNER_TEMP/dataset/canonical.json" "$CANONICAL"
          cp "$RUNNER_TEMP/dataset/bundled.json" "$BUNDLED"
          git add "$CANONICAL" "$BUNDLED"
          if git diff --cached --quiet; then
            echo "No new reset events; the data branch already matches." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore(data): refresh Codex reset history"
          # Never main. This branch carries data only and is what clients read.
          git push $lease origin "HEAD:refs/heads/${DATA_BRANCH}"
          echo "Pushed to \`${DATA_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the weekly pull request to main
        # Only on the weekly cron or a manual run: the bundled copy is a release
        # artifact, and a pull request every 30 minutes would be noise.
        if: github.event.schedule == '23 6 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch --depth=1 origin "$BASE"
          git switch -C "$REVIEW_BRANCH" "origin/$BASE"
          cp "$RUNNER_TEMP/dataset/canonical.json" "$CANONICAL"
          cp "$RUNNER_TEMP/dataset/bundled.json" "$BUNDLED"
          git add "$CANONICAL" "$BUNDLED"
          if git diff --cached --quiet; then
            echo "The bundled record already matches main; nothing to review."
            exit 0
          fi

          git commit -m "chore(data): refresh the bundled Codex reset history"
          if git ls-remote --exit-code --heads origin "$REVIEW_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$REVIEW_BRANCH"
            git push --force-with-lease origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          else
            git push -u origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          fi

          summary=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const doc = JSON.parse(readFileSync('src/data/codex-reset-history.json', 'utf8'))
          const resets = doc.events.filter(e => e.type === 'reset')
          const credits = doc.events.filter(e => e.type === 'credits')
          console.log(`${resets.length} resets and ${credits.length} credit grants, newest ${doc.events[doc.events.length - 1].announced_at}.`)
          NODE
          )

          body=$(printf '%s\n' \
            "Weekly refresh of the Codex reset history bundled with releases." \
            "" \
            "$summary" \
            "" \
            "Installed clients already read the every-30-minutes copy from \`data/codex-reset-history\`. This pull request keeps the copy compiled into the next release recent, which is the offline fallback and the floor a fetch can only improve on." \
            "" \
            "Source: https://codex-reset.com/api/timeline — a public community tracker, not operated by or endorsed by OpenAI. Only event ids, timestamps, the event type and a reset kind are kept; every text field is dropped before anything is written. The client never contacts that host." )

          if existing=$(gh pr list --head "$REVIEW_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number') && [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body" || true
            echo "Updated pull request #${existing}." >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base "$BASE" --head "$REVIEW_BRANCH" --title "chore(data): refresh the bundled Codex reset history" --body "$body"; then
            echo "Opened a pull request from \`${REVIEW_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Codex reset history updated"
              echo
              echo "The branch \`${REVIEW_BRANCH}\` was pushed, but this workflow could not open a pull request (Actions may be barred from creating them in this organization). Open it from the comparison URL below."
              echo
              echo "[Open pull request](${SERVER}/${REPOSITORY}/compare/${BASE}...${REVIEW_BRANCH}?expand=1)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
